---
- name: Install Nginx
  hosts: servers
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    # - name: Install nginx
    #   apt:
    #     name: nginx
    #     state: present

    # - name: Start nginx service
    #   service:
    #     name: nginx
    #     state: started
    #     enabled: yes

    - name: Check nginx status
      command: systemctl status nginx
      register: nginx_status
      ignore_errors: yes

    - name: Show nginx status
      debug:
        var: nginx_status.stdout_lines